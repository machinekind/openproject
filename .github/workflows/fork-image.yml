name: Build fork image

# Builds the production "slim" image from this fork and pushes it to GHCR.
# Production needs it: the fork's MCP entitlement and project setup tools are not in the official image.
#
# Manual on purpose: the build is long. It always runs this workflow file from the default branch and
# checks out the branch, tag or SHA given in "ref", so the branch being built does not need to carry it.
# Build from a stable-release based branch rather than dev (see deploy/digitalocean/README.md).
# The run summary prints the image with its digest; production pins that digest.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: true
        default: stable-17.8-mcp
      tag:
        description: Image tag (defaults to the short SHA of the built commit)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        env:
          # Inputs reach the shell as environment variables, never by interpolation into the script.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/openproject" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG:-$(git rev-parse --short=12 HEAD)}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          platforms: linux/amd64
          build-args: |
            BIM_SUPPORT=false
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "Built \`${REF}\` at \`$(git rev-parse HEAD)\`."
            echo
            echo "Put this line in the server's \`.env\`. The digest makes the deployment immune to the tag being overwritten."
            echo
            echo "\`OPENPROJECT_IMAGE=${IMAGE}:${TAG}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Build fork image

# Builds the production "slim" image from this fork and pushes it to GHCR.
# Only needed when production must run code that is not in the official OpenProject image.
# Manual on purpose: the build takes a long time and should not run on every push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (defaults to the short commit SHA)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ inputs.tag }}"
          echo "image=ghcr.io/${owner}/openproject" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          platforms: linux/amd64
          build-args: |
            BIM_SUPPORT=false
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

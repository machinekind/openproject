name: Build fork image

# Builds the production "slim" image from this fork and pushes it to GHCR.
# Production needs it: the fork's MCP entitlement and project setup tools are not in the official image.
#
# deploy-production.yml calls it for every push to dev; `make image` dispatches it by hand with a commit SHA as ref.
# Either way it checks out "ref", so the branch being built does not need to carry this file.
# Production pins the printed digest, never the tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: true
        default: dev
      tag:
        description: Image tag, MAJOR.MINOR.PATCH[-prerelease] (defaults to the short SHA of the built commit)
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: false
        default: ""
    outputs:
      image:
        description: The pushed image, pinned by digest
        value: ${{ jobs.build.outputs.image }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

permissions: {}

concurrency:
  group: fork-image-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ format('{0}:{1}@{2}', steps.meta.outputs.image, steps.meta.outputs.tag, steps.build.outputs.digest) }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ref_re='^[A-Za-z0-9._/-]+$'
          tag_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! $INPUT_REF =~ $ref_re || $INPUT_REF == -* ]]; then
            echo "::error::ref must be a branch, tag or commit SHA made of letters, digits and . _ / -"
            exit 1
          fi
          if [[ -n $INPUT_TAG && ! $INPUT_TAG =~ $tag_re ]]; then
            echo "::error::tag must be MAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        env:
          # Inputs reach the shell as environment variables, never by interpolation into the script.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/openproject" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG:-$(git rev-parse --short=12 HEAD)}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          platforms: linux/amd64
          build-args: |
            BIM_SUPPORT=false
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "Built \`${REF}\` at \`$(git rev-parse HEAD)\`."
            echo
            echo "Put this line in the server's \`.env\`. The digest makes the deployment immune to the tag being overwritten."
            echo
            echo "\`OPENPROJECT_IMAGE=${IMAGE}:${TAG}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

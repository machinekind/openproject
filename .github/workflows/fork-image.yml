name: Build fork image

# Builds the production "slim" image from this fork and pushes it to GHCR.
# Production needs it: the fork's MCP entitlement and project setup tools are not in the official image.
# Manual on purpose: the build is long. Pick the branch or tag to build in the "Run workflow" dialog,
# and build from a stable-release based branch rather than dev (see deploy/digitalocean/README.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (defaults to the short commit SHA)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ inputs.tag }}"
          echo "image=ghcr.io/${owner}/openproject" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          platforms: linux/amd64
          build-args: |
            BIM_SUPPORT=false
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` from \`${GITHUB_REF_NAME}\`. Put it in OPENPROJECT_IMAGE." >> "$GITHUB_STEP_SUMMARY"
